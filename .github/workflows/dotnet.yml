name: Build and Run Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore API dependencies
        run: dotnet restore src/Redarbor.TechnicalTest.Api/Redarbor.TechnicalTest.Api.csproj

      - name: Build API project
        run: dotnet build src/Redarbor.TechnicalTest.Api/Redarbor.TechnicalTest.Api.csproj --configuration Release --no-restore

      - name: Restore test dependencies
        run: dotnet restore tests/Redarbor.TechnicalTest.Application.Tests/Redarbor.TechnicalTest.Application.Tests.csproj

      - name: Build test project
        run: dotnet build tests/Redarbor.TechnicalTest.Application.Tests/Redarbor.TechnicalTest.Application.Tests.csproj --no-restore
        
      - name: Run unit tests
        run: dotnet test tests/Redarbor.TechnicalTest.Application.Tests/Redarbor.TechnicalTest.Application.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
