services:
  employeedb:
    container_name: employeedb
    environment:
        - ACCEPT_EULA=Y
        - SA_PASSWORD=SwN12345678
    restart: always
    ports:
        - "1433:1433"

  keycloak:
    container_name: keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm.json:ro
 
  messagebroker:
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
        - "5672:5672"
        - "15672:15672"

  redarbor.technicaltest.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=employeedb;Database=EmployeeDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
    depends_on:
      - employeedb
      - keycloak
    ports:
      - "8080"
      - "8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
 
volumes:
  keycloak-data: 
  